on:
    push:
        branches:
            - main

jobs:
    files-changed:
        uses: ./.github/workflows/files-changed.yml


    frontend-build:
        needs: files-changed
        runs-on: ubuntu-24.04
        if: needs.files-changed.outputs.frontend == 'true'
        steps:
            - name: DockerHub Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}


            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: "{{defaultContext}}:frontend"
                cache-from: type=gha,scope=frontend
                cache-to: type=gha,mode=max,scope=frontend
                push: true
                tags: ${{vars.DOCKERHUB_USERNAME}}/petclinic-frontend:${{github.sha}}

    backend-build:
        needs: files-changed
        runs-on: ubuntu-24.04
        if: needs.files-changed.outputs.backend == 'true'
        steps:
            - name: DockerHub Login
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: "{{defaultContext}}:backend"
                cache-from: type=gha,scope=backend
                cache-to: type=gha,mode=max,scope=backend
                push: true
                tags: ${{vars.DOCKERHUB_USERNAME}}/petclinic-backend:${{github.sha}}

    deploy:
      needs: [backend-build, frontend-build]
      runs-on: ubuntu-24.04
      if: ${{ !cancelled() && (needs.backend-build.result == 'success' || needs.frontend-build.result == 'success') }}
      env:
        IMAGE_TAG: ${{github.sha}}
        EC2_SSH_KEY: ${{secrets.PETCLINIC_KEY}}
        EC2_ADDRESS: ${{secrets.PETCLINIC_ADDRESS}}
        EC2_USERNAME: ${{secrets.PETCLINIC_USERNAME}}
        EC2_KNOWN_HOSTS: ${{secrets.PETCLINIC_KNOWN_HOSTS}}
      
    
      steps:
        - name: SSH Setup
          run: |
            mkdir -p ~/.ssh
            echo "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo "$EC2_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          
        - name: Update frontend image tag
          if: needs.frontend-build.result == 'success' 
          run: | 
            ssh "$EC2_USERNAME@$EC2_ADDRESS" \
              "sudo sed -i 's/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=$IMAGE_TAG/' /opt/petclinic/.env"

        - name: Update backend image tag
          if: needs.backend-build.result == 'success'
          run: |
            ssh "$EC2_USERNAME@$EC2_ADDRESS" \
             "sudo sed -i 's/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=$IMAGE_TAG/' /opt/petclinic/.env"

        - name: Restart Application
          run: |
            ssh "$EC2_USERNAME@$EC2_ADDRESS" \
             "sudo docker compose -f /opt/petclinic/compose.yml up -d"
